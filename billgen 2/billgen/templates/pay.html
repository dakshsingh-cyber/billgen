{% extends "base.html" %}
{% block container_width %}600px{% endblock %}
{% block content %}
<div class="card shadow-sm text-center"><div class="card-body p-4">
  <h3>Upgrade to Unlimited</h3>
  <p class="lead">&#8377;{{ amount_rupees }} for 30 days of unlimited bill generation.</p>
  <button id="pay-btn" class="btn btn-primary btn-lg" type="button">Pay &#8377;{{ amount_rupees }}</button>
  <p class="text-muted small mt-3 mb-0">Payments are processed securely by Razorpay.</p>
</div></div>
{% endblock %}
{% block scripts %}
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script>
  var options = {
    key: {{ key_id|tojson }},
    amount: {{ order.amount|int }},
    currency: "INR",
    order_id: {{ order.id|tojson }},
    name: "BillGen",
    description: "Unlimited plan - 30 days",
    prefill: { email: {{ user_email|tojson }} },
    theme: { color: "#0d6efd" },
    handler: function (response) {
      var form = document.createElement("form");
      form.method = "POST";
      form.action = {{ url_for('payment_verify')|tojson }};
      [["razorpay_order_id", response.razorpay_order_id],
       ["razorpay_payment_id", response.razorpay_payment_id],
       ["razorpay_signature", response.razorpay_signature]].forEach(function (pair) {
        var input = document.createElement("input");
        input.type = "hidden"; input.name = pair[0]; input.value = pair[1];
        form.appendChild(input);
      });
      document.body.appendChild(form);
      form.submit();
    },
    modal: { ondismiss: function () { /* user closed the popup; nothing to do, they can click Pay again */ } }
  };
  function openCheckout() { new Razorpay(options).open(); }
  document.getElementById("pay-btn").addEventListener("click", openCheckout);
  window.addEventListener("load", openCheckout);
</script>
{% endblock %}
