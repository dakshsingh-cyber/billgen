{% extends "base.html" %}
{% block container_width %}600px{% endblock %}
{% block content %}
<div class="card shadow-sm"><div class="card-body p-4">
  <h3 class="mb-3">Create account</h3>
  <form method="post" action="{{ url_for('signup') }}">
    <div class="mb-3"><label class="form-label" for="email">Email</label>
      <input class="form-control" type="email" id="email" name="email" required maxlength="120"></div>
    <div class="mb-3"><label class="form-label" for="password">Password</label>
      <input class="form-control" type="password" id="password" name="password" required minlength="8">
      <div class="form-text">At least 8 characters.</div></div>
    <button class="btn btn-primary w-100" type="submit">Sign up</button>
  </form>
  <p class="mt-3 mb-0">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
</div></div>
{% endblock %}
