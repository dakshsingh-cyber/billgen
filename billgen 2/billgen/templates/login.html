{% extends "base.html" %}
{% block container_width %}600px{% endblock %}
{% block content %}
<div class="card shadow-sm"><div class="card-body p-4">
  <h3 class="mb-3">Log in</h3>
  <form method="post" action="{{ url_for('login') }}">
    {% if request.args.get('next') %}<input type="hidden" name="next" value="{{ request.args.get('next') }}">{% endif %}
    <div class="mb-3"><label class="form-label" for="email">Email</label>
      <input class="form-control" type="email" id="email" name="email" required></div>
    <div class="mb-3"><label class="form-label" for="password">Password</label>
      <input class="form-control" type="password" id="password" name="password" required></div>
    <button class="btn btn-primary w-100" type="submit">Log in</button>
  </form>
  <p class="mt-3 mb-0">New here? <a href="{{ url_for('signup') }}">Create an account</a></p>
</div></div>
{% endblock %}
